# Dependabot keeps GitHub Actions and npm dependencies up to date.
# Configured for weekly updates — reduces noise while staying current.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Warsaw"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Warsaw"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
