name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel the previous run for the same branch when a new commit is pushed.
# For PRs, a new push cancels the previous CI run for that PR.
# Saves runner minutes during rapid iteration.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  # ── PR title lint (fast, no Nix) ───────────────────────────────────────────
  lint:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: PR title lint
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            chore
            style
            refactor
            test
            ci
            build
          ignoreLabels: |
            dependencies
            automation

  # ── x86_64-linux ────────────────────────────────────────────────────────────
  x86_64:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ── Nix setup ─────────────────────────────────────────────────────────
      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && secrets.CACHIX_AUTH_TOKEN || '' }}

      # ── Detect relevant changes ──────────────────────────────────────────
      - name: Check for Scala/sbt changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: changes
        with:
          filters: |
            sbt:
              - '**/*.scala'
              - '**/*.sc'
              - 'build.sbt'
              - 'project/**'
              - '**/*.sql'
              - '**/resources/**'
              - '.scalafmt.conf'

      # ── Format gates (fast; gate before slow compilation) ─────────────────
      - name: Nix flake check (pre-commit hooks, formatting, Nix lint)
        run: nix flake check

      # ── sbt / coursier cache ─────────────────────────────────────────────
      - name: Cache sbt and coursier
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
          key: x86_64-sbt-${{ hashFiles('build.sbt', 'project/**') }}
          restore-keys: |
            x86_64-sbt-

      # ── Compile, test, link (skip when no Scala/sbt files changed) ───────
      - name: Compile everything
        if: steps.changes.outputs.sbt == 'true'
        run: nix develop --command sbt "scalafmtCheckAll; scalafmtSbtCheck; compile; Test/compile"

      - name: Test with coverage
        if: steps.changes.outputs.sbt == 'true'
        timeout-minutes: 10
        run: nix develop --command sbt "coverage; testFull; coverageReport"

      - name: Link frontend (Wasm)
        if: steps.changes.outputs.sbt == 'true'
        run: nix develop --command sbt frontend/fullLinkJS

      # ── Upload coverage reports ──────────────────────────────────────────
      - name: Upload coverage reports
        if: steps.changes.outputs.sbt == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports-x86_64
          path: |
            **/scoverage-report/****
            **/coverage.*.xml
          if-no-files-found: ignore

      # ── Validate Docker image builds (main only) ─────────────────────────
      - name: Build Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker build -t lm-bot:ci .

      # ── Push devShell closure to Cachix (main only) ──────────────────────
      - name: Push devShell closure to Cachix
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cachix push knirski-lm-bot '.#devShells.x86_64-linux.default'
