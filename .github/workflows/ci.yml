name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && secrets.CACHIX_AUTH_TOKEN || '' }}

      - name: Cache sbt and coursier
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('build.sbt', 'project/**') }}

      - name: Compile everything
        run: nix develop --command sbt compile Test/compile

      - name: Test
        # testFull, not test: in sbt 2 `test` is `testQuick`, which consults a
        # global action cache and can legitimately run nothing. CI must prove the
        # whole suite passes for this commit regardless of cache state.
        run: nix develop --command sbt testFull

      - name: Link frontend (Wasm)
        run: nix develop --command sbt frontend/fullLinkJS

      - name: Check formatting
        run: nix develop --command scalafmt --list --mode diff-ref=HEAD

      - name: Nix flake check (pre-commit hooks, formatting, Nix lint)
        run: nix flake check

      - name: Push devShell closure to Cachix

      - name: Push devShell closure to Cachix
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          nix copy --to 'https://knirski-lm-bot.cachix.org' \
            .#devShells.x86_64-linux.default
