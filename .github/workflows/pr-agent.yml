# AI-powered PR review using Qodo's PR Agent (Gemini backend).
#
# Triggers:
#   - pull_request: auto-review on open, reopen, ready, and push
#   - issue_comment: commands like /review, /describe, /improve in comments
#
# Requires the `GEMINI_API_KEY` repository secret (Google AI Studio).
# Set it via: https://github.com/knirski/lm-bot/settings/secrets/actions
name: PR Agent

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
  issue_comment:
    types:
      - created

permissions:
  contents: read

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}-${{ github.event.sender.type }}
  cancel-in-progress: true

jobs:
  pr-agent:
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null) ||
      (github.event_name == 'pull_request' && github.event.sender.type != 'Bot')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Gemini API key secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY repository secret is required for PR Agent."
            exit 1
          fi

      - name: PR Agent action step
        uses: the-pr-agent/pr-agent@570f67ed5fc8db5be74c18df070bc20079b64b0d # v0.41.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
