# AI-powered PR review using Qodo's PR Agent (Gemini backend).
# Runs on every new PR, when a draft is marked ready for review,
# and on PR comments to respond to /review, /describe, /improve etc.
#
# Requires the `GEMINI_API_KEY` repository secret (Google AI Studio).
# Set it via: https://github.com/knirski/lm-bot/settings/secrets/actions
name: PR Agent

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
  issue_comment:
    types:
      - created

permissions:
  contents: read

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  pr-agent:
    if: ${{ (github.event_name == 'pull_request' && github.event.sender.type != 'Bot') || (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.sender.type != 'Bot') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Gemini API key secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY repository secret is required for PR Agent."
            exit 1
          fi

      - name: PR Agent action step
        # v0.40.0 — pinned by commit hash for supply-chain security.
        uses: the-pr-agent/pr-agent@6ad7cf75d95cb3bbb54cf2ad92050eb03804964a
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
