# Automated semantic-release workflow.
# Runs after a merge to main and creates a GitHub Release with auto-generated
# release notes based on conventional commits since the last tag.
#
# PR title must follow the convention defined in AGENTS.md.
# Version bumps are determined automatically:
#   feat: → minor, fix: → patch, feat!/fix!: → major
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install semantic-release and plugins
        run: npm ci

      - name: Semantic release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
