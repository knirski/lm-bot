# Composite action that installs Nix and configures Cachix caching.
# Used by every CI job to avoid repeating the same setup.
#
# Cachix is the only binary cache here. Determinate Systems' Magic Nix Cache
# was removed: its post-job step uploaded every built store path to the GitHub
# Actions cache, adding minutes of uploads on main pushes and competing with
# the sbt/coursier cache under the same 10 GB quota. Pushes are now explicit
# and limited to the devShell closure (see ci.yml).
#
# Example usage:
#   # PR / non-main push (no auth token — pull-only cache access)
#   - uses: ./.github/actions/setup-nix
#
#   # main push (auth token enables push access to Cachix)
#   - uses: ./.github/actions/setup-nix
#     with:
#       cachix-auth-token: '${{ secrets.CACHIX_AUTH_TOKEN }}'
name: Setup Nix
description: Install Nix with DeterminateSystems installer and configure Cachix caching

inputs:
  cachix-auth-token:
    description: |
      Cachix authentication token for write access.
      Pass only on main-branch pushes to avoid leaking the token on PRs from forks.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

    # When no auth token is provided, configure Cachix for pull-only access.
    # This is safe for PRs from forks (no secret exposure).
    - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
      if: ${{ inputs.cachix-auth-token == '' }}
      with:
        name: knirski-lm-bot

    # With an auth token the CLI is authenticated for the explicit `cachix
    # push` in ci.yml, but nothing is pushed automatically: the devShell closure
    # is the only artifact worth caching, not every derivation the job builds.
    - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
      if: ${{ inputs.cachix-auth-token != '' }}
      with:
        name: knirski-lm-bot
        authToken: '${{ inputs.cachix-auth-token }}'
        skipPush: true
