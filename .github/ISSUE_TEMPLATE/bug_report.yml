name: Bug Report
description: Report a reproducible bug to help improve lm-bot
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How to trigger the bug. Include commands, environment setup, and any relevant context.
      placeholder: |
        1. Start the server with 'sbt startDev'
        2. Send a POST to /api/auth/login with ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened instead.

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Copy-paste any error messages, stack traces, or test failures. Enclose in triple backticks.
      render: shell

  - type: input
    id: environment
    attributes:
      label: Environment
      description: |
        - Nix / OS version
        - Container runtime (docker/podman)
        - Browser (for frontend issues)
      placeholder: e.g. NixOS 25.05, Podman 5.x, Chrome 130

  - type: checkboxes
    id: checks
    attributes:
      label: Verification
      options:
        - label: I have searched existing issues for duplicates
        - label: The bug is reproducible with the latest commit on `main`
