services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: lmbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: lmbot
    volumes:
      - lmbot-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lmbot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/lmbot
      DATABASE_USER: lmbot
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      HTTP_PORT: 8080
      # TLS is terminated by the operator's reverse proxy in front of this
      # container (spec §6), but the cookie must still be marked Secure.
      COOKIE_SECURE: "true"
      LIVE_LUXMED_API: ${LIVE_LUXMED_API:?set LIVE_LUXMED_API=true}
      LMBOT_MASTER_KEY: ${LMBOT_MASTER_KEY:?set LMBOT_MASTER_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  lmbot-data:
